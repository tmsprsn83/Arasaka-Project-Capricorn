<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>CAPRI — calque</title>
  <link rel="stylesheet" href="overlay.css" />
</head>
<body>
  <!-- Calque transparent de l'écran principal : nouveau message de CAPRI, dans le style de l'appel entrant de
       Cyberpunk 2077 (photo « DELAMAIN INCOMING CALL » de Tommy), en haut de l'écran. Animé par overlay.js. -->
  <div id="hud" class="hud" aria-live="polite">
    <div class="hud-side">
      <div class="hud-micro"><i>NET_ID 7F3A</i><i>SIG.LVL 98</i><i>ENC AES256</i><i>PRT 0451</i><i>CH_02 OK</i></div>
      <!-- Téléphone portable et ses ondes, comme l'icône de l'appel entrant du jeu. -->
      <svg class="hud-phone" viewBox="0 0 24 30" aria-hidden="true">
        <rect x="3" y="8" width="11" height="20" rx="1.6" />
        <path d="M5.5 11 h6 v6 h-6 z" />
        <path d="M6 20 h1 M8 20 h1 M10 20 h1 M6 22.5 h1 M8 22.5 h1 M10 22.5 h1 M6 25 h1 M8 25 h1 M10 25 h1" />
        <path class="wave" d="M15.5 6 a3.5 3.5 0 0 1 3.5 3.5 M15.5 2.5 a7 7 0 0 1 7 7" />
      </svg>
    </div>
    <div class="hud-portrait">
      <i class="hud-ghost g5"></i><i class="hud-ghost g4"></i><i class="hud-ghost g3"></i>
      <i class="hud-ghost g2"></i><i class="hud-ghost g1"></i>
      <div class="hud-card">
        <i class="hud-tab"></i>
        <div class="hud-pic"><img src="visage/portrait.png" alt="" /><span class="hud-scan"></span></div>
        <div class="hud-pic-name">CAPRI</div>
      </div>
    </div>
    <div class="hud-text">
      <div class="hud-id">ARS_CPRCN_0x7F3A</div>
      <div class="hud-name">CAPRI</div>
      <div class="hud-state">NOUVEAU MESSAGE</div>
      <div class="hud-said"><span class="hud-said-text"></span><i class="hud-caret"></i></div>
      <div class="hud-keys">
        <span class="hud-key"><b>T</b>RÉPONDRE</span>
        <span class="hud-key reject"><b>T</b>IGNORER</span>
      </div>
    </div>
  </div>
  <script src="motion.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
